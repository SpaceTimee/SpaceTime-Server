name = "spacetime-client"
main = "src/index.ts"
compatibility_date = "2026-07-24"
workers_dev = false

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[exports.CensorSession]
type = "durable-object"
storage = "sqlite"
